name: Deploy to GitHub Pages

# Run workflow on every push to the master branch
on: workflow_dispatch

jobs:
  deploy-to-github-pages:
    permissions:
      contents: write
    # use ubuntu-latest image to run steps on
    runs-on: ubuntu-latest
    steps:
    # uses GitHub's checkout action to checkout code form the master branch
    - uses: actions/checkout@v2

    # sets up .NET Core SDK
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v3.0.3
      with:
        dotnet-version: '10'

    # Pin the SDK to .NET 10 for this job: ubuntu-latest also ships SDK 11.0.100, and without a global.json the workload
    # install below picks the net11 wasm-tools, so the net10 publish fails with NETSDK1147 (wasm-tools-net10 missing).
    # CI-only file (the repo has no global.json); same fix as SpawnDev.ILGPU.ML's deploy (2026-11-16).
    - name: Pin the .NET 10 SDK
      run: |
        echo '{"sdk":{"version":"10.0.100","rollForward":"latestFeature"}}' > global.json
        dotnet --version

    # Install dotnet wasm buildtools workload
    - name: Install .NET WASM Build Tools
      run: dotnet workload install wasm-tools

    # publishes Blazor project to the publish-folder
    - name: Publish .NET Core Project
      run: dotnet publish ./SpawnDev.Codecs.Demo/ --nologo -c:Release --output publish
      
    # copy index.html to 404.html to serve the same file when a file is not found
    - name: copy index.html to 404.html
      run: cp publish/wwwroot/index.html publish/wwwroot/404.html

    # add .nojekyll file to tell GitHub pages to not treat this as a Jekyll project. (Allow files and folders starting with an underscore)
    - name: Add .nojekyll file
      run: touch publish/wwwroot/.nojekyll      
      
    - name: Commit wwwroot to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4.4.1
      with:
        branch: gh-pages
        folder: publish/wwwroot    
